name: CDK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cdk.yml"
      - "infra/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "nest-cli.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cdk.yml"
      - "infra/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "nest-cli.json"
  workflow_dispatch:

concurrency:
  group: cdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taker_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Build server
        run: npm run build

      - name: Run migrations
        run: npm run typeorm -- migration:run
        env:
          NODE_ENV: local

      - name: Check migrations match entities
        run: npm run typeorm -- migration:generate --check src/services/database/migrations/Drift
        env:
          NODE_ENV: local

      - name: Typecheck infra
        run: npm run build
        working-directory: infra

      - name: CDK synth
        run: npx cdk synth --quiet
        working-directory: infra

  deploy:
    name: Deploy
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCOUNT_ID: ${{ secrets.CLOUD_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.CLOUD_REGION }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
      COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
      CLOUD_REGION: ${{ secrets.CLOUD_REGION }}
      CLOUD_ACCESS_KEY_ID: ${{ secrets.CLOUD_ACCESS_KEY_ID }}
      CLOUD_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      - name: Build server
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.CLOUD_REGION }}
          aws-access-key-id: ${{ secrets.CLOUD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CLOUD_SECRET_ACCESS_KEY }}

      - name: CDK bootstrap
        run: npx cdk bootstrap aws://${{ secrets.CLOUD_ACCOUNT_ID }}/${{ secrets.CLOUD_REGION }} --require-approval never
        working-directory: infra

      - name: Run migrations
        run: npm run typeorm -- migration:run

      - name: CDK deploy
        run: npx cdk deploy TakerServerStack --require-approval never
        working-directory: infra
